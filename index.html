<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workers' Comp</title>
    <script>
      /* Resolve the theme before first paint; React picks up the same value a
         moment later. Without this the app paints white, then flips to navy. */
      (function () {
        try {
          var saved = localStorage.getItem('wc-theme')
          var dark = saved === 'dark' || saved === 'light'
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-dark', dark ? 'true' : 'false')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
